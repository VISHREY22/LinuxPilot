[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "linuxpilot"
dynamic = ["version"]
description = "LinuxPilot: an MCP server that lets AI agents see and operate the Linux desktop through AT-SPI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "LinuxPilot contributors" }]
keywords = ["mcp", "model-context-protocol", "linux", "accessibility", "at-spi", "automation", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Desktop Environment",
]
dependencies = [
  "mcp>=2.3,<3",
  "anyio>=4.11",
  "pydantic>=2.12",
  "jeepney>=0.8,<1",
  "pillow>=10.4",
  "python-xlib>=0.33",
  "psutil>=5.9",
]

[project.optional-dependencies]
vision = ["pytesseract>=0.3.10"]

[project.scripts]
linuxpilot = "linuxpilot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[tool.hatch.version]
path = "src/linuxpilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/linuxpilot"]
artifacts = ["src/linuxpilot/engine/fixtures/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
  "S101",   # assert in tests
  "S603",   # subprocess without shell is deliberate
  "S607",   # system tools by name (gtk-launch, ydotool)
  "RUF001", "RUF002", "RUF003",  # unicode glyphs (…, ×, —) are intentional in output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018", "E501"]
"spikes/**" = ["S", "T201", "ASYNC240", "E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["live: drives the real desktop (skipped unless LINUXPILOT_LIVE=1)"]

[tool.coverage.run]
source = ["linuxpilot"]
branch = true

[tool.coverage.report]
show_missing = true
